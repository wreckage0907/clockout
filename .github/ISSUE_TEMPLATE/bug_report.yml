name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste tokens, session logs or calendar data. For a security problem, don't open an issue: see [SECURITY.md](https://github.com/wreckage0907/clockout/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Error text helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clockout version
      description: Output of `clockout --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version and operating system
      placeholder: Node 24.1, macOS 15
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources involved
      description: Which of Claude Code, Codex, Pi, opencode, Antigravity, GitHub, Google Calendar or ICS, Wispr Flow, an AI helper or a timesheet target.
